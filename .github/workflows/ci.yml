# ══════════════════════════════════════════════════════════════════════════
#  CI — what must be true on every push
# ══════════════════════════════════════════════════════════════════════════
#
# ⭐ THE JOB THAT MATTERS IS `engine`. Its last step is the fixture gate: the
# workbook this repository generates is compared, member by member on the raw
# compressed bytes, against reference `.xlsx` files produced by MONOSPACE'S
# OWN WRITER and committed to `packages/engine/fixtures/`.
#
# It is the only thing standing between a refactor and a school's timetable
# quietly coming out different — different colours, a lost lock, a week that
# no longer follows its template. None of that shows up in a typecheck, and
# most of it would not show up in a screenshot either. If this job goes red,
# the workbook moved, and somebody has to say why before the fixtures are
# regenerated.
#
# ⚠️ THE GATE IS `npm run gate`, NOT `npm test`, AND THAT SPLIT IS LOAD-BEARING.
# `worksheet.protect()` runs 100,000 SHA-512 rounds synchronously, once per
# sheet, 40 sheets to a workbook — so under vitest the reporter RPC starved and
# a run in which EVERY TEST PASSED still exited 1 with
# `[vitest-worker]: Timeout calling "onTaskUpdate"`. It passed on the machine
# the fixtures were made on and failed here, purely because this runner is
# slower, which is the worst shape a failure can take. The gate is now a plain
# Node program with no reporter and no IPC, so it has no channel to time out;
# `npm test` keeps the light unit tests, which are seconds.
#
# ⚠️ THEREFORE `npm test` GOING GREEN IS NO LONGER PROOF OF ANYTHING ABOUT THE
# BYTES. Both are run below, and both are checked to still exist first.
#
# The other two jobs cover the hosts: that the document is still ONE
# self-contained file, and that the Windows binary still compiles, passes its
# tests on Windows, and has the real document inside it.

name: CI

on:
  push:
    # `branches`, not bare `push`, so tags are left to release.yml rather than
    # running the same gate twice under two names.
    branches: ["**"]
  pull_request:

# A newer push supersedes an older one on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Kept identical to release.yml. See the banner there — this is the whole set
# of assumptions either workflow makes about the layout of the repository.
env:
  HTML_ARTEFACT: apps/tool/dist/timetable.html
  RUST_MANIFEST_DIR: apps/shell
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # ⭐ THE FIXTURE GATE
  # ────────────────────────────────────────────────────────────────────────
  engine:
    name: Engine fixture gate
    runs-on: ubuntu-latest
    # ⚠️ A WEDGED GATE MUST NOT BECOME A SIX-HOUR JOB. GitHub's default limit
    # is six hours, and the gate is now a long-running plain Node program: two
    # `vm` sandbox runs of ~30 s each on the machine the fixtures were made on,
    # around an esbuild service that is a CHILD PROCESS. `gate/run.ts` keeps a
    # watchdog for the handle that outlives a FINISHED run — that is a real bug
    # it has already had — but nothing inside the gate can fire for a step that
    # never resolves at all. Without this line that failure looks like a
    # six-hour timeout on a job whose log stops mid-report, which is a worse
    # version of the flake this whole split removed. The whole job measures
    # well under five minutes; thirty is headroom, not a target.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install the workspace
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # ⚠️ BOTH SCRIPTS HAVE TO PROVE THEY STILL EXIST. Root `test` is
      # `npm run test --workspaces --if-present`, which turns a workspace that
      # has lost its `test` script into a silent PASS — the one failure this
      # whole file exists to prevent, wearing a tick. `gate` is named with
      # `--workspace` and no `--if-present`, so npm errors on its own if it
      # goes missing, but it is asserted here too because the message npm
      # prints does not say what was lost. Same guard as release.yml.
      - name: Check the gate is still wired up
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./packages/engine/package.json").scripts ?? {};
            const root = require("./package.json").scripts ?? {};
            let bad = false;
            if (!pkg.test) { console.error("::error::packages/engine has no `test` script, so the root `npm test` is a green no-op."); bad = true; }
            if (!pkg.gate) { console.error("::error::packages/engine has no `gate` script. THE FIXTURE GATE IS NOT RUNNING, so our bytes are no longer compared against Monospace."); bad = true; }
            if (!root.gate) { console.error("::error::the root package.json has no `gate` script, so the step below runs nothing."); bad = true; }
            if (bad) process.exit(1);
          '

      # Seconds. The model builder's rules, the document reader, the provenance
      # pins against Monospace's source and the source-hygiene checks. Run
      # before the gate because a model regression EXPLAINS a byte difference,
      # and finding out in 15 s beats finding out in four minutes.
      - name: The light suite
        run: npm test

      # ⚠️ THE GATE'S LAST CHECK IMPORTS `dist/`, and it FAILS rather than skips
      # when `dist/` is absent on CI (`gate/run.ts` looks at $CI). That check
      # exists because `tsc` emits extensionless relative specifiers, Node's ESM
      # loader refuses them, and the published package once built cleanly and
      # could not be imported at all. Drop this step and the gate says so.
      - name: Build the package, so the published artefact is checked too
        run: npm run build --workspace packages/engine

      # ⭐ THE GATE. Committed-fixture comparison for both writer paths, the
      # CT_Worksheet element-sequence check, the sheetProtection hoist proved
      # both ways, the class-colour palette pin, the browser bundle EXECUTED in
      # a `vm` with only browser globals — unminified and minified — and the
      # published `dist/`. The live comparison against a Monospace checkout
      # reports itself SKIPPED here, by name, because there is no checkout on a
      # public runner; that is the point of committing the bytes.
      - name: ⭐ The gate — our bytes against Monospace's
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee gate.log

      # ⭐ THE NUMBERS, WHERE SOMEBODY WILL SEE THEM. "Passed" on its own says
      # nothing about what was checked, and nobody opens the log on a green run.
      - name: Put the gate's report on the job summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f gate.log ]; then exit 0; fi
          {
            echo "### The fixture gate"
            echo
            echo "<details><summary>full report</summary>"
            echo
            echo '```'
            cat gate.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────
  # The `.html` download: still one file, still needing nothing.
  # ────────────────────────────────────────────────────────────────────────
  document:
    name: Self-contained document
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the document
        id: html
        uses: ./.github/actions/build-html
        with:
          html-path: ${{ env.HTML_ARTEFACT }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Say so on the summary
        run: |
          echo "**\`timetable.html\`** — ${{ steps.html.outputs.bytes }} bytes, no external subresources." >> "$GITHUB_STEP_SUMMARY"

      # Not a release artefact — a build of this branch, so a change can be
      # tried in a browser without anybody building it locally.
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-html-${{ github.sha }}
          path: ${{ env.HTML_ARTEFACT }}
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # The `.exe` download: compiles, passes its tests on Windows, and carries
  # the real document. Here the document is built on the same runner, because
  # this build is thrown away. In `release.yml` it is emphatically NOT — the
  # released `.exe` embeds the one file the released `.html` came from.
  # ────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows binary
    runs-on: windows-latest
    # Longer than the others on purpose: a cold `Swatinem/rust-cache` means a
    # full release build with link-time optimisation, which is minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the crate is where this workflow says it is
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUST_MANIFEST_DIR/Cargo.toml" ]; then
            echo "::error::No Cargo.toml at $RUST_MANIFEST_DIR"
            echo "Set RUST_MANIFEST_DIR at the top of this file AND of release.yml."
            echo "Cargo.toml files found under the repository:"
            find . -name Cargo.toml -not -path './target/*' -maxdepth 4 || true
            exit 1
          fi

      # The crate bakes the document in at compile time, so it has to exist
      # before cargo runs.
      - name: Build the document
        uses: ./.github/actions/build-html
        with:
          html-path: ${{ env.HTML_ARTEFACT }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Point the crate at it
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ `pwd` UNDER GIT BASH ON WINDOWS RETURNS A POSIX PATH — /d/a/repo/repo —
          # and Rust's PathBuf cannot resolve that, so build.rs found no file, fell
          # back to assets/placeholder.html behind a cargo:warning, and shipped a
          # binary carrying the placeholder UI. `pwd -W` asks Git Bash for the
          # Windows form (D:/a/repo/repo); forward slashes are fine for Rust.
          # It is not a POSIX flag, hence the guard.
          if root="$(pwd -W 2>/dev/null)"; then :; else root="$(pwd)"; fi
          echo "MONOSPACE_TIMETABLE_HTML=$root/$HTML_ARTEFACT" >> "$GITHUB_ENV"
          echo "pointing the crate at $root/$HTML_ARTEFACT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_MANIFEST_DIR }} -> target
          key: windows-ci

      - name: Rust tests
        working-directory: ${{ env.RUST_MANIFEST_DIR }}
        run: cargo test --locked

      # Release profile as well as debug: link-time optimisation and the
      # static CRT in apps/shell/.cargo/config.toml only fail in release, and
      # release is the profile that ships.
      - name: Release build
        working-directory: ${{ env.RUST_MANIFEST_DIR }}
        run: cargo build --release --locked

      - name: Find the binary
        id: exe
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t found < <(find "$RUST_MANIFEST_DIR/target/release" target/release -maxdepth 1 -name '*.exe' -type f 2>/dev/null | sort -u || true)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .exe, found ${#found[@]}"
            printf '  %s\n' "${found[@]:-}"
            exit 1
          fi
          echo "path=${found[0]}" >> "$GITHUB_OUTPUT"

      # ⚠️ Read out of the PE, not inferred from the flags. `+crt-static` in
      # apps/shell/.cargo/config.toml is resolved by CURRENT WORKING
      # DIRECTORY, so it holds only because the build step sets
      # `working-directory`; and `windows_subsystem` is an attribute in
      # main.rs nothing else checks. Both fail silently — a dynamically linked
      # CRT is a missing-DLL box on a school PC, a console subsystem is a
      # black flash on every launch — and both are visible in the headers.
      - name: Prove the static CRT and the GUI subsystem survived
        shell: bash
        run: python "$RUST_MANIFEST_DIR/scripts/check-static-crt.py" '${{ steps.exe.outputs.path }}'

      # ⚠️⚠️ Caught here rather than at release time, because the failure mode
      # is a build that succeeds and ships a placeholder UI to a school.
      - name: Prove the exe embeds the real document
        uses: ./.github/actions/check-embedded
        with:
          html: ${{ env.HTML_ARTEFACT }}
          exe: ${{ steps.exe.outputs.path }}
